<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Phase 0 deployment smoke test for the AI News Assistant."
    />
    <title>AI News Briefing — Deployment Check</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <main class="page-shell">
      <section class="status-card" aria-labelledby="page-title">
        <div class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          Deployment signal received
        </div>

        <p class="eyebrow">AI News Briefing · Phase 0</p>
        <h1 id="page-title">Breaking News:<br />Your Website Exists.</h1>
        <p class="intro">
          The first checkpoint is live. The newsroom machinery comes next.
        </p>

        <div class="pipeline" aria-label="Deployment pipeline status">
          <span>Codex</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span>GitHub</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span>Vercel</span>
          <strong>ALIVE</strong>
        </div>
      </section>
    </main>
